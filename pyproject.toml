[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ai"
version = "0.1.0.dev0"
description = "Reproducible multi-agent AI experimentation framework"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = []
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
